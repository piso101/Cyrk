services:
  backend:
    build:
      context: ./BackEndCyrk
      dockerfile: Dockerfile
    container_name: backend_Cyrk
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./BackEndCyrk:/src 
      - /app:/app                   
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"  
    depends_on:
      - db


  db:
    image: postgres:15
    container_name: postgres_portfolio
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Cryk
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d