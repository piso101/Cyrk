services:
  backend:
    build:
      context: ./BackEndCyrk
    container_name: backend_Cyrk
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=Cyrk;Username=admin;Password=admin



  db:
    image: postgres:15
    container_name: postgres_portfolio
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Cyrk
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d